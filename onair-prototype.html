<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>CINEMA · 무료 영화관</title>
<meta name="theme-color" content="#0A0907" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0907;
    --bg-elev:#15110D;
    --bg-card:#1B1612;
    --line:#2A241D;
    --text:#F5F0E6;
    --text-dim:#9A9286;
    --text-muted:#5B5448;
    --gold:#E8C76E;
    --gold-bright:#FFD98A;
    --gold-deep:#A8843D;
    --red:#E84A4A;
    --serif:"Cinzel","Noto Serif KR",serif;
    --hangul:"Noto Serif KR",serif;
    --mono:"JetBrains Mono",monospace;
    --sans:"Inter","Noto Serif KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
  img{display:block;max-width:100%}

  /* ========== HEADER ========== */
  .hdr{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:24px;
    padding:14px 32px;
    background:linear-gradient(180deg,#0A0907 60%,rgba(10,9,7,0.85) 100%);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .brand{
    font-family:var(--serif);font-weight:700;font-size:26px;
    letter-spacing:0.2em;
    background:linear-gradient(180deg,#FFFAEC 0%,#E8C76E 50%,#A8843D 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 2px rgba(232,199,110,0.3));
    display:flex;align-items:center;gap:10px;
  }
  .brand-mark{color:#E8C76E;font-size:18px;-webkit-text-fill-color:#E8C76E}
  .brand-sub{
    font-family:var(--mono);font-size:10px;letter-spacing:0.3em;
    color:var(--text-muted);text-transform:uppercase;
    padding-left:14px;border-left:1px solid var(--line);
  }
  .hdr-spacer{flex:1}
  .search-box{
    position:relative;flex:0 1 360px;max-width:360px;
  }
  .search-box input{
    width:100%;padding:10px 14px 10px 36px;
    background:var(--bg-elev);border:1px solid var(--line);
    color:var(--text);font-family:var(--sans);font-size:13px;
    border-radius:0;outline:none;transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--gold)}
  .search-box input::placeholder{color:var(--text-muted)}
  .search-box::before{
    content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;
    background:radial-gradient(circle at 5px 5px,transparent 3.5px,var(--text-muted) 3.5px,var(--text-muted) 4.5px,transparent 4.5px),linear-gradient(45deg,transparent 8.5px,var(--text-muted) 8.5px,var(--text-muted) 9.5px,transparent 9.5px);
  }
  .hdr-btn{
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--text-dim);text-transform:uppercase;
    padding:8px 14px;border:1px solid transparent;transition:all .15s;
  }
  .hdr-btn:hover{color:var(--gold);border-color:var(--line)}
  .hdr-btn.active{color:var(--gold);border-color:var(--gold)}

  /* ========== HERO ========== */
  .hero{
    position:relative;height:min(72vh,640px);min-height:440px;
    overflow:hidden;border-bottom:1px solid var(--line);
  }
  .hero-bg{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    transition:opacity .5s;
  }
  .hero-bg::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg,rgba(10,9,7,0.3) 0%,rgba(10,9,7,0.6) 60%,#0A0907 100%),
      linear-gradient(90deg,rgba(10,9,7,0.85) 0%,rgba(10,9,7,0.4) 50%,transparent 100%);
  }
  .hero-content{
    position:absolute;left:0;right:0;bottom:48px;
    padding:0 32px;max-width:760px;
    z-index:2;
  }
  .hero-tag{
    display:inline-block;padding:4px 12px;
    font-family:var(--mono);font-size:10px;letter-spacing:0.24em;
    color:var(--gold);border:1px solid var(--gold);
    text-transform:uppercase;margin-bottom:18px;
  }
  .hero-title{
    font-family:var(--serif);font-weight:700;font-size:60px;
    line-height:1.05;letter-spacing:-0.01em;
    margin-bottom:8px;
    color:var(--text);
    text-shadow:0 2px 16px rgba(0,0,0,0.5);
  }
  .hero-title-ko{
    font-family:var(--hangul);font-weight:600;font-size:24px;
    color:var(--text-dim);margin-bottom:18px;
  }
  .hero-meta{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-family:var(--mono);font-size:12px;letter-spacing:0.16em;
    color:var(--text-dim);text-transform:uppercase;margin-bottom:18px;
  }
  .hero-meta .star{color:var(--gold)}
  .hero-meta .dot{color:var(--text-muted)}
  .hero-desc{
    font-size:15px;line-height:1.65;color:var(--text-dim);
    margin-bottom:28px;max-width:580px;
  }
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap}
  .btn-play{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 28px;
    background:var(--gold);color:#0A0907;
    font-family:var(--mono);font-size:13px;font-weight:600;
    letter-spacing:0.18em;text-transform:uppercase;
    transition:all .15s;
  }
  .btn-play:hover{background:var(--gold-bright);transform:translateY(-1px)}
  .btn-play .triangle{
    width:0;height:0;
    border-top:6px solid transparent;border-bottom:6px solid transparent;
    border-left:9px solid #0A0907;
  }
  .btn-fav{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 22px;
    border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:12px;letter-spacing:0.18em;
    text-transform:uppercase;transition:all .15s;
  }
  .btn-fav:hover{border-color:var(--gold);color:var(--gold)}
  .btn-fav.faved{color:var(--gold);border-color:var(--gold)}

  /* ========== ROWS / CAROUSELS ========== */
  .row{padding:32px 0 8px;position:relative}
  .row-head{
    display:flex;align-items:baseline;gap:16px;
    padding:0 32px 14px;
  }
  .row-title{
    font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:0.02em;
    color:var(--text);
  }
  .row-sub{
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--text-muted);text-transform:uppercase;
  }
  .row-track{
    display:flex;gap:16px;
    padding:0 32px 8px;
    overflow-x:auto;overflow-y:hidden;
    scroll-behavior:smooth;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .row-track::-webkit-scrollbar{height:6px}
  .row-track::-webkit-scrollbar-track{background:transparent}
  .row-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .row-track::-webkit-scrollbar-thumb:hover{background:var(--gold-deep)}

  /* ========== POSTER CARD ========== */
  .card{
    flex:0 0 auto;width:200px;
    scroll-snap-align:start;
    cursor:pointer;
    transition:transform .25s ease;
    position:relative;
  }
  .card:hover{transform:translateY(-4px)}
  .poster{
    width:200px;aspect-ratio:2/3;
    background:var(--bg-card);border:1px solid var(--line);
    position:relative;overflow:hidden;
    transition:border-color .2s;
  }
  .card:hover .poster{border-color:var(--gold)}
  .poster img{
    width:100%;height:100%;object-fit:cover;
    transition:opacity .3s;
  }
  .poster.no-img{
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:24px;
  }
  .poster.no-img .pno-title{
    font-family:var(--serif);font-style:italic;font-weight:500;font-size:22px;
    line-height:1.15;letter-spacing:-0.01em;color:var(--text);
  }
  .poster-overlay{
    position:absolute;left:0;right:0;bottom:0;
    padding:14px 12px 10px;
    background:linear-gradient(0deg,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0.6) 60%,transparent 100%);
    transform:translateY(100%);transition:transform .25s ease;
  }
  .card:hover .poster-overlay{transform:translateY(0)}
  .card-badge{
    position:absolute;top:8px;left:8px;
    padding:3px 8px;
    font-family:var(--mono);font-size:9px;letter-spacing:0.16em;
    background:rgba(0,0,0,0.7);color:var(--gold);
    border:1px solid var(--gold);text-transform:uppercase;
  }
  .card-rating{
    position:absolute;top:8px;right:8px;
    padding:3px 8px;
    font-family:var(--mono);font-size:11px;font-weight:600;
    background:rgba(0,0,0,0.8);color:var(--gold);
  }
  .card-info{
    padding:10px 4px 4px;
  }
  .card-title{
    font-family:var(--serif);font-style:italic;font-weight:500;font-size:15px;
    line-height:1.2;color:var(--text);
    overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .card-title-ko{
    font-family:var(--hangul);font-weight:500;font-size:12px;
    color:var(--text-dim);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card-meta{
    margin-top:6px;
    font-family:var(--mono);font-size:10px;letter-spacing:0.14em;
    color:var(--text-muted);text-transform:uppercase;
  }

  /* ========== MODAL PLAYER ========== */
  .modal-bg{
    position:fixed;inset:0;z-index:100;
    background:rgba(5,4,3,0.92);
    backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;
    padding:24px;
  }
  .modal-bg.open{display:flex}
  .modal{
    width:100%;max-width:1080px;
    background:var(--bg-elev);border:1px solid var(--line);
    box-shadow:0 24px 80px rgba(0,0,0,0.6);
    display:flex;flex-direction:column;
    max-height:92vh;
  }
  .modal-head{
    display:flex;align-items:center;gap:14px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
  }
  .modal-title{
    flex:1;font-family:var(--serif);font-style:italic;font-weight:600;
    font-size:18px;line-height:1.2;
  }
  .modal-close{
    font-family:var(--mono);font-size:12px;letter-spacing:0.18em;
    color:var(--text-dim);padding:6px 12px;
    border:1px solid var(--line);transition:all .15s;
  }
  .modal-close:hover{color:var(--gold);border-color:var(--gold)}
  .modal-player{
    width:100%;aspect-ratio:16/9;
    background:#000;position:relative;
  }
  .modal-player iframe,.modal-player video{
    width:100%;height:100%;border:0;
  }
  .modal-fallback{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:14px;
    color:var(--text-dim);
  }
  .modal-fallback-title{
    font-family:var(--serif);font-style:italic;font-size:24px;color:var(--text);
  }
  .modal-fallback-link{
    font-family:var(--mono);font-size:12px;color:var(--gold);
    border:1px solid var(--gold);padding:10px 20px;letter-spacing:0.18em;
    text-transform:uppercase;
  }
  .modal-fallback-link:hover{background:rgba(232,199,110,0.1)}
  .modal-meta{
    padding:18px 20px;border-top:1px solid var(--line);
    overflow-y:auto;
  }
  .modal-meta-row{
    display:flex;gap:14px;flex-wrap:wrap;
    font-family:var(--mono);font-size:11px;letter-spacing:0.14em;
    color:var(--text-dim);text-transform:uppercase;margin-bottom:14px;
  }
  .modal-meta-row .star{color:var(--gold)}
  .modal-desc{font-size:13px;line-height:1.7;color:var(--text-dim)}
  .modal-actions{
    margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;
  }

  /* ========== EMPTY / FOOTER ========== */
  .empty{
    padding:60px 32px;text-align:center;
    color:var(--text-muted);font-family:var(--mono);
    font-size:12px;letter-spacing:0.18em;text-transform:uppercase;
  }
  .footer{
    margin-top:60px;padding:24px 32px;
    border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:10px;letter-spacing:0.18em;
    color:var(--text-muted);text-transform:uppercase;
    flex-wrap:wrap;gap:12px;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 980px){
    .hero{height:min(60vh,520px)}
    .hero-title{font-size:42px}
    .hero-title-ko{font-size:18px}
    .card,.poster{width:160px}
  }
  @media (max-width: 640px){
    .hdr{padding:12px 16px;gap:12px;flex-wrap:wrap}
    .brand{font-size:20px}
    .brand-sub{display:none}
    .search-box{flex:1 1 100%;order:3;max-width:none}
    .hero{height:auto;min-height:auto;padding-bottom:24px}
    .hero-content{position:relative;padding:24px 16px;bottom:auto;max-width:none}
    .hero-title{font-size:32px}
    .hero-title-ko{font-size:16px;margin-bottom:12px}
    .hero-meta{font-size:10px;gap:10px}
    .hero-desc{font-size:13px;margin-bottom:18px}
    .btn-play{padding:11px 20px;font-size:11px}
    .btn-fav{padding:11px 16px;font-size:10px}
    .row{padding:20px 0 4px}
    .row-head{padding:0 16px 10px}
    .row-title{font-size:18px}
    .row-sub{font-size:10px}
    .row-track{padding:0 16px 8px;gap:10px}
    .card,.poster{width:130px}
    .card-title{font-size:13px}
    .card-title-ko{font-size:11px}
    .modal-bg{padding:0}
    .modal{max-height:100vh;height:100vh;border:0}
  }
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">
    <span class="brand-mark">❖</span>
    <span>CINEMA</span>
  </div>
  <div class="brand-sub">무료 영화관 · GLOBAL FREE FILMS</div>
  <div class="hdr-spacer"></div>
  <div class="search-box">
    <input id="search" type="search" placeholder="영화 검색 (제목·감독·연도)" autocomplete="off" />
  </div>
  <button class="hdr-btn" id="filter-fav" title="즐겨찾기 보기">★ 즐겨찾기</button>
</header>

<section class="hero" id="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-content">
    <div class="hero-tag" id="hero-tag">오늘의 추천</div>
    <h1 class="hero-title" id="hero-title">Loading…</h1>
    <div class="hero-title-ko" id="hero-title-ko"></div>
    <div class="hero-meta" id="hero-meta"></div>
    <p class="hero-desc" id="hero-desc"></p>
    <div class="hero-cta">
      <button class="btn-play" id="hero-play">
        <span class="triangle"></span>
        <span>지금 재생</span>
      </button>
      <button class="btn-fav" id="hero-fav">+ 즐겨찾기</button>
    </div>
  </div>
</section>

<main id="rows-container"></main>

<footer class="footer">
  <div>CINEMA · 무료 영화관 · v0.20.0</div>
  <div>POWERED BY INTERNET ARCHIVE · KOFA · YOUTUBE</div>
</footer>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true">
  <div class="modal" role="document">
    <div class="modal-head">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" id="modal-close" aria-label="닫기">✕ ESC</button>
    </div>
    <div class="modal-player" id="modal-player"></div>
    <div class="modal-meta">
      <div class="modal-meta-row" id="modal-meta-row"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     CINEMA · 무료 영화관 · v0.20.0
     소스 정책 (전부 합법·무료·임베드 가능):
       - "archive"  : Internet Archive 퍼블릭 도메인 영화 (직접 임베드)
       - "youtube"  : YouTube 채널 또는 영상 ID (KOFA / FilmRise / Omeleto 등)
       - "search"   : YouTube 검색 결과로 외부 이동 (큐레이터가 video ID 미확정시)
     모든 카드는 항상 "유튜브에서 보기" 외부 링크 폴백 제공.
     ============================================================ */

  const $ = (s,r=document)=>r.querySelector(s);
  const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

  /* ============ 영화 데이터 (60편) ============ */
  /* 한국 영화 우선 (24편) → 고전 명작 (12편) → 인디·단편 (10편) → 액션·B (8편) → 다큐 (6편) */

  const MOVIES = [
    /* ===== 🇰🇷 K-시네마 클래식 (KOFA 한국영상자료원) ===== */
    { id:"kr-hanyo-1960", title:"Hanyo", titleKo:"하녀", year:1960, director:"김기영", genre:"스릴러",
      runtime:"108분", rating:8.7, country:"🇰🇷", cat:"k-classic",
      source:"search", query:"하녀 김기영 1960 한국고전영화", channel:"@KoreanFilm",
      desc:"한 음악 교사 가정에 들어온 가정부가 가족을 파멸로 이끄는 한국 누아르의 정점. 박찬욱·봉준호 감독이 인생작으로 꼽는 김기영의 걸작." },
    { id:"kr-obaltan-1961", title:"Aimless Bullet", titleKo:"오발탄", year:1961, director:"유현목", genre:"드라마",
      runtime:"110분", rating:8.5, country:"🇰🇷", cat:"k-classic",
      source:"search", query:"오발탄 유현목 1961 한국고전영화",
      desc:"한국전쟁 직후 서울. 가난과 절망 속에서 무너져 가는 한 가족의 초상. 한국 리얼리즘 영화의 출발점." },
    { id:"kr-mateo-1966", title:"Late Autumn", titleKo:"만추", year:1966, director:"이만희", genre:"멜로",
      runtime:"94분", rating:8.3, country:"🇰🇷", cat:"k-classic",
      source:"search", query:"만추 이만희 1966 한국고전영화",
      desc:"3일간 외출이 허락된 여죄수와 도망자의 짧고 깊은 사랑. 김태용 감독 〈만추〉의 원작." },
    { id:"kr-babo-1975", title:"March of Fools", titleKo:"바보들의 행진", year:1975, director:"하길종", genre:"청춘",
      runtime:"105분", rating:8.1, country:"🇰🇷", cat:"k-classic",
      source:"search", query:"바보들의 행진 하길종 1975",
      desc:"유신 시대 청춘들의 절망과 방황을 그린 한국 청춘 영화의 고전. 송창식 〈고래사냥〉 OST." },
    { id:"kr-yeongja-1975", title:"Yeong-ja's Heydays", titleKo:"영자의 전성시대", year:1975, director:"김호선", genre:"드라마",
      runtime:"103분", rating:7.9, country:"🇰🇷", cat:"k-classic",
      source:"search", query:"영자의 전성시대 김호선 1975",
      desc:"산업화 시기 도시로 상경한 시골 처녀의 비극을 그린 호스티스 영화의 정점." },

      runtime:"15-60분", rating:0, country:"🇺🇸", cat:"docs",
      source:"youtube", ytChannel:"@VICE", ytQuery:"VICE documentary",
      desc:"전쟁터·서브컬처·범죄·약물. 거친 현장 르포 다큐." },
    { id:"doc-kbs", title:"KBS 다큐", titleKo:"KBS 다큐", year:2024, director:"KBS", genre:"다큐",
      runtime:"45-50분", rating:0, country:"🇰🇷", cat:"docs",
      source:"youtube", ytChannel:"@KBSDocumentary", ytQuery:"KBS 다큐 풀버전",
      desc:"한국 공영방송 KBS 의 다큐멘터리 풀버전 라이브러리." },
    { id:"doc-sbs", title:"SBS 다큐", titleKo:"SBS 다큐", year:2024, director:"SBS", genre:"다큐",
      runtime:"45-50분", rating:0, country:"🇰🇷", cat:"docs",
      source:"youtube", ytChannel:"@SBSCNBC", ytQuery:"SBS 스페셜 다큐 풀버전",
      desc:"SBS 스페셜·그것이 알고 싶다 등 한국 다큐 풀버전." },
  ];

  const CATEGORIES = [
    { id:"k-classic", title:"K-Cinema · 한국 영화", sub:"24 films · KOFA 한국영상자료원 큐레이션" },
    { id:"classic",   title:"Classic Masterpieces · 흑백의 명작", sub:"12 films · 퍼블릭 도메인 · 임베드 OK" },
    { id:"indie",     title:"Indie & Shorts · 인디·단편", sub:"10 channels · Omeleto · Vimeo · MUBI" },
    { id:"action",    title:"Action & Cult · 액션·컬트", sub:"8 channels · FilmRise · Paramount Vault" },
    { id:"docs",      title:"Documentary · 다큐멘터리", sub:"6 channels · BBC Earth · NatGeo · KBS" },
  ];

  /* ============ 즐겨찾기 ============ */
  const FAV_KEY = "cinema-favs-v1";
  function getFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||"[]"); }catch{ return []; } }
  function isFav(id){ return getFavs().includes(id); }
  function toggleFav(id){
    const f = getFavs();
    const i = f.indexOf(id);
    if(i>=0) f.splice(i,1); else f.unshift(id);
    localStorage.setItem(FAV_KEY, JSON.stringify(f));
    return i<0;
  }

  /* ============ 포스터 URL 생성 ============ */
  function posterUrl(m){
    if(m.poster) return m.poster;
    if(m.source === "archive") return `https://archive.org/services/img/${encodeURIComponent(m.archiveId)}`;
    return null;
  }

  /* ============ 외부 링크 (폴백) ============ */
  function externalUrl(m){
    if(m.source === "archive") return `https://archive.org/details/${m.archiveId}`;
    if(m.source === "youtube" && m.ytQuery) return `https://www.youtube.com/results?search_query=${encodeURIComponent(m.ytQuery)}`;
    if(m.source === "youtube" && m.ytChannel) return `https://www.youtube.com/${m.ytChannel}`;
    if(m.source === "search") return `https://www.youtube.com/results?search_query=${encodeURIComponent(m.query)}`;
    if(m.source === "link") return m.url;
    return "#";
  }

  /* ============ 임베드 src 생성 ============ */
  function embedSrc(m){
    if(m.source === "archive") return `https://archive.org/embed/${m.archiveId}`;
    if(m.source === "youtube" && m.videoId) return `https://www.youtube-nocookie.com/embed/${m.videoId}?autoplay=1&playsinline=1`;
    if(m.source === "youtube" && m.ytChannel){
      // 채널의 최신 업로드를 검색 임베드로 가져옴
      return `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(m.ytQuery||m.ytChannel)}&autoplay=1&playsinline=1`;
    }
    return null;
  }

  /* ============ 카드 렌더 ============ */
  function renderCard(m){
    const card = document.createElement("button");
    card.className = "card";
    card.dataset.id = m.id;
    card.setAttribute("aria-label", `${m.titleKo} (${m.year}) 재생`);

    const poster = document.createElement("div");
    const pUrl = posterUrl(m);
    if(pUrl){
      poster.className = "poster";
      const img = document.createElement("img");
      img.src = pUrl;
      img.alt = m.title;
      img.loading = "lazy";
      img.onerror = ()=>{
        poster.classList.add("no-img");
        img.remove();
        const t = document.createElement("div");
        t.className = "pno-title";
        t.textContent = m.title;
        poster.appendChild(t);
      };
      poster.appendChild(img);
    } else {
      poster.className = "poster no-img";
      const t = document.createElement("div");
      t.className = "pno-title";
      t.textContent = m.title;
      poster.appendChild(t);
    }

    if(m.country){
      const b = document.createElement("div");
      b.className = "card-badge";
      b.textContent = m.country;
      poster.appendChild(b);
    }
    if(m.rating > 0){
      const r = document.createElement("div");
      r.className = "card-rating";
      r.textContent = `★ ${m.rating.toFixed(1)}`;
      poster.appendChild(r);
    }

    const info = document.createElement("div");
    info.className = "card-info";
    info.innerHTML = `
      <div class="card-title">${m.title}</div>
      ${m.titleKo && m.titleKo !== m.title ? `<div class="card-title-ko">${m.titleKo}</div>` : ""}
      <div class="card-meta">${m.year} · ${m.genre}</div>
    `;

    card.appendChild(poster);
    card.appendChild(info);
    card.addEventListener("click", ()=>openModal(m));
    return card;
  }

  /* ============ Row 렌더 ============ */
  function renderRows(filterFn){
    const container = $("#rows-container");
    container.innerHTML = "";
    let totalShown = 0;

    for(const cat of CATEGORIES){
      const items = MOVIES.filter(m => m.cat === cat.id && (filterFn ? filterFn(m) : true));
      if(items.length === 0) continue;
      totalShown += items.length;

      const row = document.createElement("section");
      row.className = "row";
      row.innerHTML = `
        <div class="row-head">
          <div class="row-title">${cat.title}</div>
          <div class="row-sub">${items.length} films</div>
        </div>
      `;
      const track = document.createElement("div");
      track.className = "row-track";
      items.forEach(m => track.appendChild(renderCard(m)));
      row.appendChild(track);
      container.appendChild(row);
    }

    if(totalShown === 0){
      container.innerHTML = `<div class="empty">검색 결과가 없습니다</div>`;
    }
  }

  /* ============ Hero 렌더 ============ */
  let heroMovie = null;
  function renderHero(){
    // 추천: 한국 영화 + 평점 8.0+ 중에 랜덤
    const pool = MOVIES.filter(m => m.cat === "k-classic" && m.rating >= 8.0);
    heroMovie = pool[Math.floor(Math.random()*pool.length)] || MOVIES[0];

    const m = heroMovie;
    const bg = $("#hero-bg");
    const pUrl = posterUrl(m);
    if(pUrl){
      bg.style.backgroundImage = `url(${pUrl})`;
    } else {
      // gradient fallback
      bg.style.background = `linear-gradient(135deg, #1B1612 0%, #2A241D 100%)`;
    }
    $("#hero-title").textContent = m.title;
    $("#hero-title-ko").textContent = m.titleKo && m.titleKo !== m.title ? m.titleKo : "";
    const ratingHtml = m.rating > 0 ? `<span class="star">★ ${m.rating.toFixed(1)}</span><span class="dot">·</span>` : "";
    $("#hero-meta").innerHTML = `
      ${ratingHtml}
      <span>${m.year}</span><span class="dot">·</span>
      <span>${m.director}</span><span class="dot">·</span>
      <span>${m.genre}</span><span class="dot">·</span>
      <span>${m.runtime}</span><span class="dot">·</span>
      <span>${m.country}</span>
    `;
    $("#hero-desc").textContent = m.desc;
    const favBtn = $("#hero-fav");
    favBtn.classList.toggle("faved", isFav(m.id));
    favBtn.textContent = isFav(m.id) ? "★ 즐겨찾기" : "+ 즐겨찾기";
  }

  /* ============ Modal ============ */
  function openModal(m){
    $("#modal-title").textContent = `${m.titleKo || m.title}${m.titleKo && m.titleKo !== m.title ? ` · ${m.title}` : ""}`;

    const player = $("#modal-player");
    const src = embedSrc(m);
    if(src){
      player.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
    } else {
      // 검색·외부링크 타입은 외부 이동만 가능
      const ext = externalUrl(m);
      player.innerHTML = `
        <div class="modal-fallback">
          <div class="modal-fallback-title">${m.country} ${m.title}</div>
          <div>이 영화는 임베드 정책상 앱 내 재생이 불가합니다.<br>아래 버튼으로 유튜브에서 직접 시청하세요.</div>
          <a class="modal-fallback-link" href="${ext}" target="_blank" rel="noopener noreferrer">▶ 유튜브에서 보기 ↗</a>
        </div>`;
    }

    const ratingHtml = m.rating > 0 ? `<span class="star">★ ${m.rating.toFixed(1)}</span>` : `<span>NEW</span>`;
    $("#modal-meta-row").innerHTML = `
      ${ratingHtml}
      <span>${m.year}</span>
      <span>${m.director}</span>
      <span>${m.genre}</span>
      <span>${m.runtime}</span>
      <span>${m.country}</span>
    `;
    $("#modal-desc").textContent = m.desc;

    const ext = externalUrl(m);
    const isCurrentlyFav = isFav(m.id);
    $("#modal-actions").innerHTML = `
      <a class="modal-fallback-link" href="${ext}" target="_blank" rel="noopener noreferrer">유튜브에서 보기 ↗</a>
      <button class="modal-fallback-link" id="modal-fav-btn">${isCurrentlyFav ? "★ 즐겨찾기 해제" : "+ 즐겨찾기 추가"}</button>
    `;
    $("#modal-fav-btn").addEventListener("click", ()=>{
      const nowFav = toggleFav(m.id);
      $("#modal-fav-btn").textContent = nowFav ? "★ 즐겨찾기 해제" : "+ 즐겨찾기 추가";
      // hero 동기화
      if(heroMovie && heroMovie.id === m.id) renderHero();
    });

    $("#modal").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeModal(){
    $("#modal").classList.remove("open");
    $("#modal-player").innerHTML = "";
    document.body.style.overflow = "";
  }

  /* ============ Init ============ */
  function init(){
    renderHero();
    renderRows();

    $("#hero-play").addEventListener("click", ()=>heroMovie && openModal(heroMovie));
    $("#hero-fav").addEventListener("click", ()=>{
      if(!heroMovie) return;
      toggleFav(heroMovie.id);
      renderHero();
    });

    $("#modal-close").addEventListener("click", closeModal);
    $("#modal").addEventListener("click", e=>{ if(e.target.id === "modal") closeModal(); });
    document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeModal(); });

    let favMode = false;
    $("#filter-fav").addEventListener("click", ()=>{
      favMode = !favMode;
      $("#filter-fav").classList.toggle("active", favMode);
      $("#search").value = "";
      if(favMode){
        const favs = getFavs();
        renderRows(m => favs.includes(m.id));
      } else {
        renderRows();
      }
    });

    let timer;
    $("#search").addEventListener("input", e=>{
      clearTimeout(timer);
      const q = e.target.value.trim().toLowerCase();
      timer = setTimeout(()=>{
        favMode = false;
        $("#filter-fav").classList.remove("active");
        if(!q){ renderRows(); return; }
        renderRows(m =>
          (m.title||"").toLowerCase().includes(q) ||
          (m.titleKo||"").toLowerCase().includes(q) ||
          (m.director||"").toLowerCase().includes(q) ||
          (m.genre||"").toLowerCase().includes(q) ||
          String(m.year||"").includes(q)
        );
      }, 150);
    });

    // 서비스워커 (있으면 등록)
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  }
  init();
</script>
