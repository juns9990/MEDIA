<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>MEDIA · Time Dial</title>
<meta name="theme-color" content="#0A0A12" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A12;
    --bg-elev:#12121C;
    --bg-card:#181826;
    --line:rgba(255,255,255,0.08);
    --line-2:rgba(255,255,255,0.16);
    --text:#F2F0EC;
    --text-dim:#8C8A9A;
    --text-muted:#52505E;

    /* default slot accent (overridden per slot) */
    --accent:#F2C770;
    --accent-glow:rgba(242,199,112,0.18);
    --accent-deep:#A8843D;

    --mono:"JetBrains Mono",monospace;
    --sans:"Inter","Noto Sans KR",system-ui,sans-serif;
    --kr:"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;outline:none}
  img{display:block;max-width:100%}

  /* Slot color background overlay */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(ellipse 1200px 600px at 50% -20%, var(--accent-glow) 0%, transparent 60%),
      linear-gradient(180deg,#0A0A12 0%,#06060B 100%);
    transition:background 1.2s ease;
  }

  /* ========== HEADER ========== */
  .hdr{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;
    background:rgba(10,10,18,0.7);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
    transition:background .8s, box-shadow .8s;
  }
  .brand-name{
    font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:0.32em;
    color:var(--text);
  }
  .brand-sub{
    font-family:var(--mono);font-size:10px;letter-spacing:0.28em;
    color:var(--text-muted);text-transform:uppercase;
    padding-left:14px;border-left:1px solid var(--line);
  }
  .nav-actions{display:flex;gap:6px}
  .nav-btn{
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--text-dim);text-transform:uppercase;
    padding:8px 14px;border:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .nav-btn:hover{color:var(--accent);border-color:var(--line-2)}
  .nav-btn.active{color:var(--accent);border-color:var(--accent)}

  /* ========== CLOCK SECTION ========== */
  .clock-sect{
    padding:60px 28px 30px;
    text-align:left;
  }
  .clock-time{
    font-family:var(--mono);font-weight:300;
    font-size:clamp(72px,16vw,200px);
    line-height:0.95;letter-spacing:-0.04em;
    color:var(--text);
    display:flex;align-items:baseline;gap:14px;
  }
  .clock-time .colon{
    color:var(--accent);
    animation:blink 2s steps(2,end) infinite;
  }
  @keyframes blink{50%{opacity:0.4}}
  .clock-time .secs{
    font-size:0.32em;color:var(--text-muted);font-weight:300;
    letter-spacing:0;align-self:flex-end;padding-bottom:0.5em;
  }
  .clock-meta{
    margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-family:var(--mono);font-size:12px;letter-spacing:0.22em;
    color:var(--text-dim);text-transform:uppercase;
  }
  .clock-meta .dot{color:var(--text-muted);opacity:0.5}
  .clock-meta .accent{color:var(--accent);font-weight:500}
  .clock-mood{
    margin-top:24px;
    font-family:var(--sans);font-weight:600;
    font-size:clamp(20px,3.4vw,32px);
    color:var(--text);letter-spacing:-0.01em;
    max-width:720px;line-height:1.3;
  }
  .clock-mood-ko{
    margin-top:6px;font-family:var(--kr);font-weight:500;
    font-size:clamp(13px,1.6vw,16px);
    color:var(--text-dim);
  }

  /* ========== TIME STRIP ========== */
  .strip-wrap{
    padding:24px 28px 36px;
    border-bottom:1px solid var(--line);
  }
  .strip-label{
    font-family:var(--mono);font-size:10px;letter-spacing:0.28em;
    color:var(--text-muted);text-transform:uppercase;margin-bottom:18px;
  }
  .strip{
    position:relative;
    display:grid;grid-template-columns:repeat(8,1fr);gap:8px;
  }
  .strip-line{
    position:absolute;left:0;right:0;top:7px;height:1px;
    background:var(--line-2);z-index:0;
  }
  .strip-slot{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:0;cursor:pointer;
    transition:transform .15s;
  }
  .strip-slot:hover{transform:translateY(-2px)}
  .strip-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--bg);
    border:1px solid var(--line-2);
    transition:all .25s;
  }
  .strip-slot.preview .strip-dot{background:var(--text-dim);border-color:var(--text-dim)}
  .strip-slot.now .strip-dot{
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 0 14px var(--accent),0 0 0 4px var(--accent-glow);
  }
  .strip-time{
    font-family:var(--mono);font-size:11px;font-weight:500;
    color:var(--text-muted);letter-spacing:0.08em;
  }
  .strip-slot.now .strip-time{color:var(--accent);font-weight:600}
  .strip-slot.preview .strip-time{color:var(--text-dim)}
  .strip-name{
    font-family:var(--mono);font-size:9px;
    color:var(--text-muted);letter-spacing:0.18em;text-transform:uppercase;
    text-align:center;
    display:none;
  }

  /* ========== HERO (NOW PLAYING) ========== */
  .hero{
    padding:36px 28px 28px;
    border-bottom:1px solid var(--line);
  }
  .hero-tag{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;letter-spacing:0.32em;
    color:var(--accent);text-transform:uppercase;margin-bottom:14px;
  }
  .hero-tag::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .hero-card{
    display:grid;grid-template-columns:minmax(280px,2fr) 3fr;
    gap:28px;align-items:center;
  }
  .hero-thumb{
    aspect-ratio:16/9;background:var(--bg-card);
    border:1px solid var(--line);overflow:hidden;
    position:relative;
  }
  .hero-thumb img{width:100%;height:100%;object-fit:cover}
  .hero-thumb.no-img{
    background:linear-gradient(135deg,var(--bg-card) 0%,var(--bg-elev) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .hero-thumb-mark{
    font-family:var(--mono);font-size:11px;letter-spacing:0.28em;
    color:var(--accent);text-transform:uppercase;
  }
  .hero-info .hero-source{
    font-family:var(--mono);font-size:11px;letter-spacing:0.22em;
    color:var(--accent);text-transform:uppercase;margin-bottom:10px;
  }
  .hero-info h2{
    font-family:var(--sans);font-weight:700;
    font-size:clamp(22px,3vw,34px);
    line-height:1.15;letter-spacing:-0.01em;
    color:var(--text);margin-bottom:8px;
  }
  .hero-info .hero-ko{
    font-family:var(--kr);font-weight:500;font-size:14px;
    color:var(--text-dim);margin-bottom:14px;
  }
  .hero-info .hero-desc{
    font-size:14px;line-height:1.7;color:var(--text-dim);
    max-width:520px;margin-bottom:22px;
  }
  .hero-cta{display:flex;gap:10px;flex-wrap:wrap}
  .btn-play{
    display:inline-flex;align-items:center;gap:10px;
    padding:13px 22px;
    background:var(--accent);color:#0A0A12;
    font-family:var(--mono);font-weight:600;font-size:12px;
    letter-spacing:0.2em;text-transform:uppercase;
    transition:all .15s;
  }
  .btn-play:hover{filter:brightness(1.15)}
  .btn-play .triangle{
    width:0;height:0;
    border-top:6px solid transparent;border-bottom:6px solid transparent;
    border-left:9px solid #0A0A12;
  }
  .btn-ghost{
    padding:13px 18px;
    border:1px solid var(--line-2);color:var(--text);
    font-family:var(--mono);font-weight:500;font-size:11px;
    letter-spacing:0.2em;text-transform:uppercase;
    transition:all .15s;
  }
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

  /* ========== ROW (slot grid) ========== */
  .row{padding:30px 28px}
  .row-head{
    display:flex;align-items:baseline;gap:14px;
    margin-bottom:18px;flex-wrap:wrap;
  }
  .row-title{
    font-family:var(--sans);font-weight:700;font-size:20px;
    color:var(--text);letter-spacing:-0.005em;
  }
  .row-meta{
    font-family:var(--mono);font-size:10px;letter-spacing:0.24em;
    color:var(--text-muted);text-transform:uppercase;
  }
  .row-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
  }

  /* ========== CARD ========== */
  .card{
    cursor:pointer;
    background:var(--bg-card);
    border:1px solid var(--line);
    overflow:hidden;
    transition:transform .2s, border-color .2s;
    text-align:left;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--accent)}
  .card-thumb{
    aspect-ratio:16/9;background:var(--bg-elev);
    position:relative;overflow:hidden;
  }
  .card-thumb img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .35s;
  }
  .card:hover .card-thumb img{transform:scale(1.04)}
  .card-thumb.no-img{
    background:linear-gradient(135deg,var(--bg-card) 0%,var(--bg-elev) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .card-thumb.no-img .card-mark{
    font-family:var(--mono);font-size:24px;font-weight:300;
    color:var(--accent);letter-spacing:-0.02em;
  }
  .card-type-badge{
    position:absolute;top:8px;left:8px;
    padding:3px 7px;
    font-family:var(--mono);font-size:9px;font-weight:500;
    letter-spacing:0.16em;text-transform:uppercase;
    background:rgba(0,0,0,0.65);color:var(--accent);
    border:1px solid var(--accent);
    backdrop-filter:blur(4px);
  }
  .card-live-dot{
    position:absolute;top:8px;right:8px;
    display:flex;align-items:center;gap:5px;
    padding:3px 7px;
    font-family:var(--mono);font-size:9px;font-weight:600;
    background:rgba(228,64,74,0.85);color:#fff;
    letter-spacing:0.18em;text-transform:uppercase;
  }
  .card-live-dot::before{
    content:"";width:6px;height:6px;border-radius:50%;background:#fff;
    animation:pulse 1.4s ease-in-out infinite;
  }
  .card-body{padding:14px 14px 16px}
  .card-source{
    font-family:var(--mono);font-size:9px;letter-spacing:0.22em;
    color:var(--accent);text-transform:uppercase;margin-bottom:6px;
  }
  .card-title{
    font-family:var(--sans);font-weight:600;font-size:14px;
    line-height:1.3;color:var(--text);margin-bottom:4px;
    overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .card-ko{
    font-family:var(--kr);font-weight:400;font-size:11px;
    color:var(--text-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ========== OTHER TIMES PREVIEW ========== */
  .other-wrap{
    padding:30px 28px 60px;
    border-top:1px solid var(--line);
  }
  .other-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px;margin-top:18px;
  }
  .other-card{
    cursor:pointer;
    padding:18px 16px;
    background:var(--bg-card);
    border:1px solid var(--line);
    transition:all .2s;
    text-align:left;
  }
  .other-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .other-card.now{border-color:var(--accent);background:var(--bg-elev)}
  .other-emoji{font-size:22px;margin-bottom:10px;display:block}
  .other-time{
    font-family:var(--mono);font-size:11px;letter-spacing:0.22em;
    color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;
  }
  .other-card.now .other-time{color:var(--accent)}
  .other-name{
    font-family:var(--sans);font-weight:600;font-size:13px;
    color:var(--text);margin-bottom:2px;
  }
  .other-name-ko{
    font-family:var(--kr);font-weight:400;font-size:11px;
    color:var(--text-dim);
  }

  /* ========== MODAL PLAYER ========== */
  .modal-bg{
    position:fixed;inset:0;z-index:100;
    background:rgba(2,2,8,0.92);
    backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;
    padding:24px;
  }
  .modal-bg.open{display:flex}
  .modal{
    width:100%;max-width:1080px;
    background:var(--bg-elev);
    border:1px solid var(--line-2);
    box-shadow:0 24px 80px rgba(0,0,0,0.6);
    display:flex;flex-direction:column;
    max-height:92vh;
  }
  .modal-head{
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  .modal-source{
    font-family:var(--mono);font-size:10px;letter-spacing:0.24em;
    color:var(--accent);text-transform:uppercase;
  }
  .modal-title{
    flex:1;font-family:var(--sans);font-weight:600;
    font-size:15px;line-height:1.3;color:var(--text);
  }
  .modal-close{
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--text-dim);padding:6px 10px;
    border:1px solid var(--line-2);transition:all .15s;
  }
  .modal-close:hover{color:var(--accent);border-color:var(--accent)}
  .modal-player{
    width:100%;aspect-ratio:16/9;
    background:#000;position:relative;
  }
  .modal-player iframe,.modal-player video,.modal-player audio{
    width:100%;height:100%;border:0;background:#000;
  }
  .modal-fb{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:14px;
    color:var(--text-dim);
  }
  .modal-fb-title{
    font-family:var(--sans);font-weight:600;font-size:18px;color:var(--text);
  }
  .modal-meta{
    padding:16px 18px;border-top:1px solid var(--line);
    overflow-y:auto;
  }
  .modal-desc{font-size:13px;line-height:1.7;color:var(--text-dim);margin-bottom:14px}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
  .modal-link{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--accent);border:1px solid var(--accent);
    padding:9px 16px;text-transform:uppercase;
    transition:background .15s;
  }
  .modal-link:hover{background:var(--accent-glow)}

  /* ========== RESPONSIVE ========== */
  @media (max-width: 880px){
    .clock-sect{padding:40px 20px 20px}
    .strip-wrap{padding:20px 20px 28px}
    .hero{padding:28px 20px 20px}
    .hero-card{grid-template-columns:1fr;gap:18px}
    .row{padding:24px 20px}
    .other-wrap{padding:24px 20px 40px}
  }
  @media (max-width: 580px){
    .hdr{padding:14px 16px}
    .brand-sub{display:none}
    .nav-btn{padding:6px 10px;font-size:10px}
    .clock-sect{padding:32px 16px 16px}
    .strip-wrap{padding:18px 16px 24px}
    .strip{gap:4px}
    .strip-time{font-size:9px;letter-spacing:0.04em}
    .hero{padding:24px 16px 18px}
    .row{padding:20px 16px}
    .row-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    .other-wrap{padding:20px 16px 32px}
    .other-grid{grid-template-columns:repeat(2,1fr)}
    .modal-bg{padding:0}
    .modal{max-height:100vh;height:100vh;border:0}
    .clock-time .secs{display:none}
  }
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">MEDIA</div>
    <div class="brand-sub" id="brand-sub">TIME · DIAL</div>
  </div>
  <nav class="nav-actions">
    <button class="nav-btn active" id="nav-now" title="현재 시각으로">● NOW</button>
    <button class="nav-btn" id="nav-all" title="모든 시간대 보기">≡ ALL</button>
  </nav>
</header>

<section class="clock-sect">
  <div class="clock-time" id="clock-time">
    <span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span class="secs" id="ss">--</span>
  </div>
  <div class="clock-meta">
    <span id="weekday">···</span>
    <span class="dot">·</span>
    <span id="date">···</span>
    <span class="dot">·</span>
    <span class="accent" id="slot-name">····</span>
  </div>
  <div class="clock-mood" id="slot-mood">Loading…</div>
  <div class="clock-mood-ko" id="slot-mood-ko"></div>
</section>

<section class="strip-wrap">
  <div class="strip-label">24-HOUR DIAL · TAP TO PREVIEW</div>
  <div class="strip" id="strip">
    <div class="strip-line"></div>
  </div>
</section>

<section class="hero">
  <div class="hero-tag">NOW PLAYING · 지금 추천</div>
  <div class="hero-card">
    <div class="hero-thumb" id="hero-thumb"></div>
    <div class="hero-info">
      <div class="hero-source" id="hero-source">···</div>
      <h2 id="hero-title">Loading…</h2>
      <div class="hero-ko" id="hero-ko"></div>
      <div class="hero-desc" id="hero-desc"></div>
      <div class="hero-cta">
        <button class="btn-play" id="hero-play"><span class="triangle"></span><span>지금 재생</span></button>
        <button class="btn-ghost" id="hero-skip">↻ 다른 추천</button>
      </div>
    </div>
  </div>
</section>

<section class="row">
  <div class="row-head">
    <div class="row-title" id="grid-title">····</div>
    <div class="row-meta" id="grid-meta">····</div>
  </div>
  <div class="row-grid" id="grid"></div>
</section>

<section class="other-wrap">
  <div class="row-head">
    <div class="row-title">다른 시간대 둘러보기</div>
    <div class="row-meta">8 SLOTS · 24H</div>
  </div>
  <div class="other-grid" id="other"></div>
</section>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true">
  <div class="modal" role="document">
    <div class="modal-head">
      <div class="modal-source" id="m-source"></div>
      <div class="modal-title" id="m-title"></div>
      <button class="modal-close" id="m-close">✕ ESC</button>
    </div>
    <div class="modal-player" id="m-player"></div>
    <div class="modal-meta">
      <div class="modal-desc" id="m-desc"></div>
      <div class="modal-actions" id="m-actions"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
/* ============================================================
   MEDIA · Time Dial · v1.0.0
   하루를 8개 시간대로 나눠 글로벌 미디어를 자동 큐레이션.
   소스 정책 (전부 합법·임베드 가능):
     - hls       : HLS 라이브 (BBC / NHK / Al Jazeera 등)
     - yt-live   : YouTube live_stream 임베드 (24/7 채널)
     - yt-channel: YouTube 채널 search 임베드 (최신 업로드 자동)
     - yt-video  : YouTube 특정 영상 ID
     - archive   : Internet Archive 직접 임베드
     - radio     : radio.garden 외부 임베드 (iframe)

const slotById = id => SLOTS.find(s => s.id === id);
function getCurrentSlot(){
  const h = new Date().getHours();
  // mapping by start..end with wrap (night spans 22-02)
  for(const s of SLOTS){
    if(s.start < s.end){
      if(h >= s.start && h < s.end) return s;
    } else {
      // wrap (e.g. night 22-26 → 22..23 or 0..1)
      if(h >= s.start || h < (s.end-24)) return s;
    }
  }
  return SLOTS[0];
}

/* ============ 슬롯 색상 적용 ============ */
function applySlotTheme(slot){
  const root = document.documentElement;
  root.style.setProperty("--accent", slot.accent);
  root.style.setProperty("--accent-glow", slot.glow);
  root.style.setProperty("--accent-deep", slot.deep);
}

/* ============ HLS / 플레이어 ============ */
let hlsInstance = null;
function destroyHls(){ if(hlsInstance){ try{ hlsInstance.destroy(); }catch{} hlsInstance = null; } }
function attachHls(video, url){
  destroyHls();
  if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = url;
    video.play().catch(()=>{});
    return;
  }
  if(window.Hls && Hls.isSupported()){
    hlsInstance = new Hls({ lowLatencyMode:true });
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, ()=>video.play().catch(()=>{}));
  }
}

/* ============ 미디어 외부 URL ============ */
function externalUrl(m){
  if(m.type === "yt-channel" && m.ytChannel){
    if(m.ytChannel.startsWith("@")) return `https://www.youtube.com/${m.ytChannel}`;
    return `https://www.youtube.com/channel/${m.ytChannel}`;
  }
  if(m.type === "yt-live" && m.ytChannel) return `https://www.youtube.com/channel/${m.ytChannel}/live`;
  if(m.type === "yt-video" && m.videoId) return `https://www.youtube.com/watch?v=${m.videoId}`;
  if(m.type === "archive") return `https://archive.org/details/${m.archiveId}`;
  if(m.type === "link") return m.url;
  if(m.type === "hls") return m.hlsUrl;
  return "#";
}

/* ============ 카드 썸네일 URL ============ */
function thumbUrl(m){
  if(m.poster) return m.poster;
  if(m.type === "archive") return `https://archive.org/services/img/${encodeURIComponent(m.archiveId)}`;
  if(m.type === "yt-video" && m.videoId) return `https://i.ytimg.com/vi/${m.videoId}/hqdefault.jpg`;
  return null;
}

/* ============ 카드 렌더 ============ */
function renderCard(m){
  const card = document.createElement("button");
  card.className = "card";
  card.dataset.id = m.id;

  const thumb = document.createElement("div");
  const tu = thumbUrl(m);
  if(tu){
    thumb.className = "card-thumb";
    const img = document.createElement("img");
    img.src = tu;
    img.alt = m.title;
    img.loading = "lazy";
    img.onerror = ()=>{
      thumb.classList.add("no-img");
      img.remove();
      const mark = document.createElement("div");
      mark.className = "card-mark";
      mark.textContent = "◐ " + (m.source||"MEDIA");
      thumb.appendChild(mark);
    };
    thumb.appendChild(img);
  } else {
    thumb.className = "card-thumb no-img";
    const mark = document.createElement("div");
    mark.className = "card-mark";
    mark.textContent = "◐ " + (m.source||"MEDIA");
    thumb.appendChild(mark);
  }

  const typeLabel = ({
    "hls":"LIVE",
    "yt-live":"LIVE",
    "yt-channel":"YT",
    "yt-video":"VIDEO",
    "archive":"ARCHIVE",
    "link":"EXTERNAL",
    "radio":"RADIO",
  })[m.type] || "MEDIA";
  if(m.live){
    const ld = document.createElement("div");
    ld.className = "card-live-dot";
    ld.textContent = "LIVE";
    thumb.appendChild(ld);
  } else {
    const tb = document.createElement("div");
    tb.className = "card-type-badge";
    tb.textContent = typeLabel;
    thumb.appendChild(tb);
  }

  const body = document.createElement("div");
  body.className = "card-body";
  body.innerHTML = `
    <div class="card-source">${m.source||""}</div>
    <div class="card-title">${m.title}</div>
    ${m.titleKo && m.titleKo !== m.title ? `<div class="card-ko">${m.titleKo}</div>` : ""}
  `;

  card.appendChild(thumb);
  card.appendChild(body);
  card.addEventListener("click", ()=>openMedia(m));
  return card;
}

/* ============ 슬롯 렌더 ============ */
let currentSlotId = null;
let currentMedia = null;
let viewMode = "now"; // "now" | "all"

function renderSlot(slotId){
  const slot = slotById(slotId);
  if(!slot) return;
  currentSlotId = slotId;
  applySlotTheme(slot);

  // brand sub
  $("#brand-sub").textContent = `${slot.label} · ${slot.start.toString().padStart(2,"0")}-${(slot.end%24).toString().padStart(2,"0")}`;
  // slot name + mood
  $("#slot-name").textContent = `${slot.emoji} ${slot.label}`;
  $("#slot-mood").textContent = slot.mood;
  $("#slot-mood-ko").textContent = slot.moodKo;

  // strip update
  $$(".strip-slot").forEach(el => {
    el.classList.toggle("now", el.dataset.slot === slotId);
    el.classList.toggle("preview", el.dataset.slot !== slotId);
  });

  // grid: 해당 슬롯의 미디어
  const items = MEDIA.filter(m => m.slot === slotId);
  $("#grid-title").textContent = `${slot.emoji} ${slot.labelKo} 추천`;
  $("#grid-meta").textContent = `${items.length} ITEMS · ${slot.label}`;
  const grid = $("#grid");
  grid.innerHTML = "";
  items.forEach(m => grid.appendChild(renderCard(m)));

  // hero: 첫번째 라이브 우선, 없으면 첫 항목
  pickHero(items);
}

function pickHero(items){
  if(!items || items.length === 0) return;
  const live = items.filter(m => m.live);
  const pool = live.length ? live : items;
  const m = pool[Math.floor(Math.random()*pool.length)];
  currentMedia = m;
  $("#hero-source").textContent = m.source || "";
  $("#hero-title").textContent = m.title;
  $("#hero-ko").textContent = m.titleKo && m.titleKo !== m.title ? m.titleKo : "";
  $("#hero-desc").textContent = m.desc || "";

  const ht = $("#hero-thumb");
  ht.innerHTML = "";
  const tu = thumbUrl(m);
  if(tu){
    ht.classList.remove("no-img");
    const img = document.createElement("img");
    img.src = tu;
    img.alt = m.title;
    img.onerror = ()=>{
      ht.classList.add("no-img");
      img.remove();
      const mk = document.createElement("div");
      mk.className = "hero-thumb-mark";
      mk.textContent = "◐ " + (m.source||"MEDIA");
      ht.appendChild(mk);
    };
    ht.appendChild(img);
  } else {
    ht.classList.add("no-img");
    const mk = document.createElement("div");
    mk.className = "hero-thumb-mark";
    mk.textContent = "◐ " + (m.source||"MEDIA");
    ht.appendChild(mk);
  }
}

/* ============ Time Strip (8 dots) ============ */
function renderStrip(){
  const strip = $("#strip");
  // keep .strip-line; remove other slots
  $$(".strip-slot", strip).forEach(el => el.remove());
  for(const s of SLOTS){
    const el = document.createElement("button");
    el.className = "strip-slot";
    el.dataset.slot = s.id;
    el.innerHTML = `
      <div class="strip-dot"></div>
      <div class="strip-time">${s.start.toString().padStart(2,"0")}</div>
      <div class="strip-name">${s.label}</div>
    `;
    el.title = `${s.label} · ${s.start}-${s.end%24} · ${s.moodKo}`;
    el.addEventListener("click", ()=>{
      viewMode = "preview";
      $("#nav-now").classList.remove("active");
      renderSlot(s.id);
    });
    strip.appendChild(el);
  }
}

/* ============ Other times grid ============ */
function renderOther(){
  const wrap = $("#other");
  wrap.innerHTML = "";
  const nowSlot = getCurrentSlot();
  for(const s of SLOTS){
    const items = MEDIA.filter(m => m.slot === s.id);
    const el = document.createElement("button");
    el.className = "other-card" + (s.id === nowSlot.id ? " now" : "");
    el.innerHTML = `
      <span class="other-emoji">${s.emoji}</span>
      <div class="other-time">${s.start.toString().padStart(2,"0")}–${(s.end%24).toString().padStart(2,"0")} · ${items.length} items</div>
      <div class="other-name">${s.label}</div>
      <div class="other-name-ko">${s.labelKo} · ${s.moodKo.split("·")[0].trim()}</div>
    `;
    el.addEventListener("click", ()=>{
      viewMode = "preview";
      $("#nav-now").classList.remove("active");
      renderSlot(s.id);
      window.scrollTo({ top:0, behavior:"smooth" });
    });
    wrap.appendChild(el);
  }
}

/* ============ Modal ============ */
function openMedia(m){
  $("#m-source").textContent = m.source || "";
  $("#m-title").textContent = `${m.title}${m.titleKo && m.titleKo !== m.title ? " · " + m.titleKo : ""}`;
  const player = $("#m-player");
  player.innerHTML = "";

  if(m.type === "hls"){
    const v = document.createElement("video");
    v.controls = true; v.autoplay = true; v.playsInline = true;
    player.appendChild(v);
    attachHls(v, m.hlsUrl);
  } else if(m.type === "yt-live" && m.ytChannel){
    const ch = m.ytChannel.startsWith("@") ? m.ytChannel : m.ytChannel;
    const param = m.ytChannel.startsWith("UC") ? `channel=${m.ytChannel}` : `user=${m.ytChannel.replace("@","")}`;
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/live_stream?${param}&autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  } else if(m.type === "yt-video" && m.videoId){
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${m.videoId}?autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  } else if(m.type === "yt-channel" && m.ytChannel){
    const q = encodeURIComponent((m.title || m.source || ""));
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed?listType=search&list=${q}&autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  } else if(m.type === "archive"){
    player.innerHTML = `<iframe src="https://archive.org/embed/${m.archiveId}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  } else {
    const ext = externalUrl(m);
    player.innerHTML = `
      <div class="modal-fb">
        <div class="modal-fb-title">${m.source || m.title}</div>
        <div>이 미디어는 외부 사이트에서 재생됩니다.<br>아래 버튼으로 이동하세요.</div>
        <a class="modal-link" href="${ext}" target="_blank" rel="noopener noreferrer">▶ ${m.type === "link" ? "외부 사이트 열기" : "유튜브에서 보기"} ↗</a>
      </div>`;
  }

  $("#m-desc").textContent = m.desc || "";
  const ext = externalUrl(m);
  $("#m-actions").innerHTML = `
    <a class="modal-link" href="${ext}" target="_blank" rel="noopener noreferrer">${m.type === "link" ? "외부에서 열기 ↗" : "원본 ↗"}</a>
  `;

  $("#modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  $("#modal").classList.remove("open");
  $("#m-player").innerHTML = "";
  destroyHls();
  document.body.style.overflow = "";
}

/* ============ Clock tick ============ */
function tickClock(){
  const d = new Date();
  $("#hh").textContent = d.getHours().toString().padStart(2,"0");
  $("#mm").textContent = d.getMinutes().toString().padStart(2,"0");
  $("#ss").textContent = d.getSeconds().toString().padStart(2,"0");
  const wd = ["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()];
  $("#weekday").textContent = wd;
  $("#date").textContent = `${d.getFullYear()}.${(d.getMonth()+1).toString().padStart(2,"0")}.${d.getDate().toString().padStart(2,"0")}`;
}

/* ============ NOW / ALL nav ============ */
function goNow(){
  viewMode = "now";
  $("#nav-now").classList.add("active");
  $("#nav-all").classList.remove("active");
  renderSlot(getCurrentSlot().id);
  window.scrollTo({ top:0, behavior:"smooth" });
}
function goAll(){
  viewMode = "all";
  $("#nav-all").classList.add("active");
  $("#nav-now").classList.remove("active");
  // scroll to other-grid
  $(".other-wrap").scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ============ Init ============ */
function init(){
  renderStrip();
  renderOther();
  tickClock();
  setInterval(tickClock, 1000);

  // 자동: 현재 시각 슬롯
  renderSlot(getCurrentSlot().id);

  // 매 분 현재 슬롯 자동 갱신 (사용자가 'now' 모드일 때만)
  setInterval(()=>{
    if(viewMode === "now"){
      const ns = getCurrentSlot();
      if(ns.id !== currentSlotId) renderSlot(ns.id);
    }
  }, 60*1000);

  $("#hero-play").addEventListener("click", ()=>currentMedia && openMedia(currentMedia));
  $("#hero-skip").addEventListener("click", ()=>{
    const items = MEDIA.filter(m => m.slot === currentSlotId);
    pickHero(items);
  });
  $("#nav-now").addEventListener("click", goNow);
  $("#nav-all").addEventListener("click", goAll);
  $("#m-close").addEventListener("click", closeModal);
  $("#modal").addEventListener("click", e=>{ if(e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeModal(); });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
}
init();
</script>
