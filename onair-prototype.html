<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>MEDIA · Growth Network</title>
<meta name="theme-color" content="#0A0A0A" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --bg-elev:#141414;
    --bg-card:#1A1A1A;
    --line:rgba(255,255,255,0.08);
    --line-2:rgba(255,255,255,0.16);
    --text:#F2F0EC;
    --text-dim:#8C8A85;
    --text-muted:#52504C;
    --accent:#F5C84B;
    --accent-dim:#A8862A;
    --accent-glow:rgba(245,200,75,0.18);
    --live:#E4404A;

    --mono:"JetBrains Mono",monospace;
    --sans:"Inter","Noto Sans KR",system-ui,sans-serif;
    --kr:"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(ellipse 1000px 500px at 30% -20%, var(--accent-glow) 0%, transparent 60%),
      linear-gradient(180deg,#0A0A0A 0%,#050505 100%);
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;outline:none}
  img{display:block;max-width:100%}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:0}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.16)}

  /* ========== HEADER ========== */
  .hdr{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;
    background:rgba(10,10,10,0.78);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
  }
  .brand-name{
    font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:0.32em;
  }
  .brand-sub{
    font-family:var(--mono);font-size:10px;letter-spacing:0.28em;
    color:var(--text-muted);text-transform:uppercase;
    padding-left:14px;border-left:1px solid var(--line);
  }
  .hdr-right{display:flex;align-items:center;gap:14px}
  .onair-tag{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;letter-spacing:0.28em;
    color:var(--live);text-transform:uppercase;
  }
  .onair-tag::before{
    content:"";width:7px;height:7px;border-radius:50%;
    background:var(--live);box-shadow:0 0 10px var(--live);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  .nav-btn{
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--text-dim);text-transform:uppercase;
    padding:8px 14px;border:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .nav-btn:hover,.nav-btn.active{color:var(--accent);border-color:var(--accent)}

  /* ========== HERO ========== */
  .hero{
    padding:60px 28px 40px;
    border-bottom:1px solid var(--line);
  }
  .hero-tag{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;letter-spacing:0.32em;
    color:var(--accent);text-transform:uppercase;margin-bottom:18px;
  }
  .hero-tag::before{
    content:"";width:18px;height:1px;background:var(--accent);
  }
  .hero-card{
    display:grid;grid-template-columns:minmax(320px,1.2fr) 1fr;
    gap:36px;align-items:center;
  }
  .hero-thumb{
    aspect-ratio:16/9;background:var(--bg-card);
    border:1px solid var(--line);overflow:hidden;
    position:relative;
  }
  .hero-thumb img{width:100%;height:100%;object-fit:cover}
  .hero-thumb.no-img{
    background:linear-gradient(135deg,var(--bg-card) 0%,var(--bg-elev) 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;letter-spacing:0.28em;
    color:var(--accent);text-transform:uppercase;
  }
  .hero-info .hero-meta{
    display:flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:0.22em;
    color:var(--accent);text-transform:uppercase;margin-bottom:14px;
  }
  .hero-info .hero-meta .pipe{color:var(--text-muted);opacity:0.5}
  .hero-info h1{
    font-family:var(--sans);font-weight:700;
    font-size:clamp(28px,4vw,48px);
    line-height:1.1;letter-spacing:-0.015em;
    color:var(--text);margin-bottom:12px;
  }
  .hero-info .hero-ko{
    font-family:var(--kr);font-weight:500;
    font-size:clamp(14px,1.7vw,17px);
    color:var(--text-dim);margin-bottom:20px;
  }
  .hero-info .hero-desc{
    font-size:15px;line-height:1.7;color:var(--text-dim);
    max-width:520px;margin-bottom:28px;
    font-family:var(--kr);
  }
  .hero-cta{display:flex;gap:10px;flex-wrap:wrap}
  .btn-play{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 26px;
    background:var(--accent);color:#0A0A0A;
    font-family:var(--mono);font-weight:600;font-size:12px;
    letter-spacing:0.22em;text-transform:uppercase;
    transition:filter .15s;
  }
  .btn-play:hover{filter:brightness(1.12)}
  .btn-play .triangle{
    width:0;height:0;
    border-top:6px solid transparent;border-bottom:6px solid transparent;
    border-left:9px solid #0A0A0A;
  }
  .btn-ghost{
    padding:14px 18px;
    border:1px solid var(--line-2);color:var(--text);
    font-family:var(--mono);font-weight:500;font-size:11px;
    letter-spacing:0.2em;text-transform:uppercase;
    transition:all .15s;
  }
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

  /* ========== CHANNEL SWITCHER ========== */
  .switch-wrap{
    padding:36px 28px 0;
    border-bottom:1px solid var(--line);
  }
  .switch-head{
    display:flex;align-items:baseline;gap:14px;margin-bottom:18px;
  }
  .switch-title{
    font-family:var(--mono);font-size:11px;letter-spacing:0.28em;
    color:var(--text-dim);text-transform:uppercase;
  }
  .switch-count{
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--accent);
  }
  .switch-row{
    display:flex;gap:8px;
    overflow-x:auto;padding-bottom:24px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .switch-row::-webkit-scrollbar{height:4px}
  .ch-chip{
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    padding:14px 18px;min-width:170px;
    background:var(--bg-card);border:1px solid var(--line);
    transition:all .2s;
    scroll-snap-align:start;
    text-align:left;
  }
  .ch-chip:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .ch-chip.active{
    border-color:var(--accent);
    background:linear-gradient(135deg,rgba(245,200,75,0.1) 0%,rgba(245,200,75,0.02) 100%);
  }
  .ch-chip-num{
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;font-weight:600;
    letter-spacing:0.2em;color:var(--text-muted);
  }
  .ch-chip-emoji{font-size:14px;line-height:1}
  .ch-chip.active .ch-chip-num{color:var(--accent)}
  .ch-chip-name{
    font-family:var(--sans);font-weight:600;font-size:13px;
    color:var(--text);letter-spacing:-0.005em;
    white-space:nowrap;
  }
  .ch-chip-ko{
    font-family:var(--kr);font-weight:400;font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  /* ========== ROW (channel programs) ========== */
  .row{padding:36px 28px}
  .row-head{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:14px;margin-bottom:24px;flex-wrap:wrap;
  }
  .row-head-l .row-eyebrow{
    display:flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:10px;letter-spacing:0.28em;
    color:var(--accent);text-transform:uppercase;margin-bottom:8px;
  }
  .row-head-l h2{
    font-family:var(--sans);font-weight:700;
    font-size:clamp(22px,2.6vw,30px);
    color:var(--text);letter-spacing:-0.01em;line-height:1.15;
  }
  .row-head-l .row-ko{
    font-family:var(--kr);font-weight:400;font-size:14px;
    color:var(--text-dim);margin-top:6px;
  }
  .row-head-r{
    font-family:var(--mono);font-size:10px;letter-spacing:0.24em;
    color:var(--text-muted);text-transform:uppercase;
  }
  .row-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
  }

  /* ========== CARD ========== */
  .card{
    cursor:pointer;
    background:var(--bg-card);
    border:1px solid var(--line);
    overflow:hidden;
    transition:transform .2s, border-color .2s;
    text-align:left;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--accent)}
  .card-thumb{
    aspect-ratio:16/9;background:var(--bg-elev);
    position:relative;overflow:hidden;
  }
  .card-thumb img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .35s;
  }
  .card:hover .card-thumb img{transform:scale(1.04)}
  .card-thumb.no-img{
    background:linear-gradient(135deg,var(--bg-card) 0%,var(--bg-elev) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .card-thumb.no-img .card-mark{
    font-family:var(--mono);font-size:13px;font-weight:500;
    letter-spacing:0.18em;text-transform:uppercase;
    color:var(--accent);text-align:center;padding:0 14px;
  }
  .card-badge{
    position:absolute;top:10px;left:10px;
    padding:4px 8px;
    font-family:var(--mono);font-size:9px;font-weight:600;
    letter-spacing:0.2em;text-transform:uppercase;
    background:rgba(0,0,0,0.7);color:var(--accent);
    border:1px solid var(--accent);
    backdrop-filter:blur(4px);
  }
  .card-body{padding:14px 14px 16px}
  .card-source{
    font-family:var(--mono);font-size:10px;letter-spacing:0.22em;
    color:var(--accent);text-transform:uppercase;margin-bottom:6px;
  }
  .card-title{
    font-family:var(--sans);font-weight:600;font-size:14px;
    line-height:1.32;color:var(--text);margin-bottom:4px;
    overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .card-ko{
    font-family:var(--kr);font-weight:400;font-size:11px;
    color:var(--text-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ========== ALL CHANNELS GRID ========== */
  .all-wrap{
    padding:40px 28px 60px;
    border-top:1px solid var(--line);
  }
  .all-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;margin-top:24px;
  }
  .all-card{
    cursor:pointer;
    padding:22px 18px;
    background:var(--bg-card);
    border:1px solid var(--line);
    transition:all .2s;
    text-align:left;
  }
  .all-card:hover{border-color:var(--accent);transform:translateY(-3px)}
  .all-card.active{border-color:var(--accent);background:var(--bg-elev)}
  .all-card-num{
    display:flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:10px;font-weight:600;
    letter-spacing:0.22em;color:var(--text-muted);text-transform:uppercase;
    margin-bottom:14px;
  }
  .all-card.active .all-card-num{color:var(--accent)}
  .all-card-emoji{font-size:18px;line-height:1}
  .all-card-name{
    font-family:var(--sans);font-weight:700;font-size:16px;
    color:var(--text);letter-spacing:-0.005em;margin-bottom:6px;
  }
  .all-card-ko{
    font-family:var(--kr);font-weight:500;font-size:12px;
    color:var(--text-dim);margin-bottom:12px;
  }
  .all-card-meta{
    font-family:var(--mono);font-size:10px;letter-spacing:0.18em;
    color:var(--text-muted);text-transform:uppercase;
  }

  /* ========== MODAL ========== */
  .modal-bg{
    position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,0.93);
    backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;
    padding:24px;
  }
  .modal-bg.open{display:flex}
  .modal{
    width:100%;max-width:1080px;
    background:var(--bg-elev);
    border:1px solid var(--line-2);
    box-shadow:0 24px 80px rgba(0,0,0,0.6);
    display:flex;flex-direction:column;
    max-height:92vh;
  }
  .modal-head{
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  .modal-source{
    font-family:var(--mono);font-size:10px;letter-spacing:0.24em;
    color:var(--accent);text-transform:uppercase;flex-shrink:0;
  }
  .modal-title{
    flex:1;font-family:var(--sans);font-weight:600;
    font-size:15px;line-height:1.3;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .modal-close{
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--text-dim);padding:6px 10px;
    border:1px solid var(--line-2);transition:all .15s;
    flex-shrink:0;
  }
  .modal-close:hover{color:var(--accent);border-color:var(--accent)}
  .modal-player{
    width:100%;aspect-ratio:16/9;
    background:#000;position:relative;
  }
  .modal-player iframe,.modal-player video{
    width:100%;height:100%;border:0;background:#000;
  }
  .modal-fb{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:14px;
    color:var(--text-dim);
  }
  .modal-fb-title{
    font-family:var(--sans);font-weight:600;font-size:18px;color:var(--text);
  }
  .modal-meta{
    padding:18px 20px;border-top:1px solid var(--line);
    overflow-y:auto;
  }
  .modal-desc{
    font-size:14px;line-height:1.7;color:var(--text-dim);margin-bottom:14px;
    font-family:var(--kr);
  }
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
  .modal-link{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;
    color:var(--accent);border:1px solid var(--accent);
    padding:9px 16px;text-transform:uppercase;
    transition:background .15s;
  }
  .modal-link:hover{background:var(--accent-glow)}

  /* ========== RESPONSIVE ========== */
  @media (max-width: 880px){
    .hero{padding:40px 20px 28px}
    .hero-card{grid-template-columns:1fr;gap:22px}
    .switch-wrap{padding:28px 20px 0}
    .row{padding:28px 20px}
    .all-wrap{padding:32px 20px 40px}
  }
  @media (max-width: 580px){
    .hdr{padding:14px 16px}
    .brand-sub{display:none}
    .nav-btn{padding:6px 10px;font-size:10px}
    .onair-tag{font-size:9px}
    .hero{padding:30px 16px 24px}
    .hero-info h1{font-size:24px}
    .switch-wrap{padding:24px 16px 0}
    .switch-row{padding-bottom:20px}
    .ch-chip{min-width:148px;padding:12px 14px}
    .row{padding:24px 16px}
    .row-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    .all-wrap{padding:28px 16px 36px}
    .all-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .all-card{padding:16px 14px}
    .modal-bg{padding:0}
    .modal{max-height:100vh;height:100vh;border:0}
  }
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">MEDIA</div>
    <div class="brand-sub">GROWTH NETWORK</div>
  </div>
  <div class="hdr-right">
    <span class="onair-tag">ON AIR</span>
    <button class="nav-btn active" id="nav-feat">★ FEATURED</button>
    <button class="nav-btn" id="nav-all">≡ ALL</button>
  </div>
</header>

<section class="hero">
  <div class="hero-tag">FEATURED · 오늘의 추천 방송</div>
  <div class="hero-card">
    <div class="hero-thumb" id="hero-thumb"></div>
    <div class="hero-info">
      <div class="hero-meta">
        <span id="hero-ch">CH 01 · TED & IDEAS</span>
        <span class="pipe">·</span>
        <span id="hero-source">TED</span>
      </div>
      <h1 id="hero-title">Loading…</h1>
      <div class="hero-ko" id="hero-ko"></div>
      <div class="hero-desc" id="hero-desc"></div>
      <div class="hero-cta">
        <button class="btn-play" id="hero-play"><span class="triangle"></span><span>지금 시청</span></button>
        <button class="btn-ghost" id="hero-skip">↻ 다른 추천</button>
      </div>
    </div>
  </div>
</section>

<section class="switch-wrap">
  <div class="switch-head">
    <div class="switch-title">CHANNELS</div>
    <div class="switch-count" id="switch-count">12 CH</div>
  </div>
  <div class="switch-row" id="switch-row"></div>
</section>

<section class="row">
  <div class="row-head">
    <div class="row-head-l">
      <div class="row-eyebrow" id="row-eyebrow">CH ·</div>
      <h2 id="row-title">····</h2>
      <div class="row-ko" id="row-ko"></div>
    </div>
    <div class="row-head-r" id="row-meta">····</div>
  </div>
  <div class="row-grid" id="row-grid"></div>
</section>

<section class="all-wrap">
  <div class="row-head">
    <div class="row-head-l">
      <div class="row-eyebrow">전체 채널 · ALL CHANNELS</div>
      <h2>모든 자기개발 방송</h2>
      <div class="row-ko">12개 채널 · 약 70개 프로그램</div>
    </div>
  </div>
  <div class="all-grid" id="all-grid"></div>
</section>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true">
  <div class="modal" role="document">
    <div class="modal-head">
      <div class="modal-source" id="m-source"></div>
      <div class="modal-title" id="m-title"></div>
      <button class="modal-close" id="m-close">✕ ESC</button>
    </div>
    <div class="modal-player" id="m-player"></div>
    <div class="modal-meta">
      <div class="modal-desc" id="m-desc"></div>
      <div class="modal-actions" id="m-actions"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
/* ============================================================
   MEDIA · GROWTH NETWORK · v2.0.0
   자기개발 전문 방송국 — 12 채널 × 평균 6 프로그램
   소스: 전부 합법·임베드 가능 (YouTube / Internet Archive / 외부)
   ============================================================ */

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

/* ============ 12 채널 ============ */
const CHANNELS = [
  { id:"ted",        num:"01", emoji:"💡", label:"TED & IDEAS",      labelKo:"TED · 아이디어",
    desc:"세상을 바꾼 강연들 · 18분의 영감", english:"World-changing talks." },
  { id:"mindset",    num:"02", emoji:"🧠", label:"MINDSET",          labelKo:"마인드셋 · 태도",

/* ============ HLS 플레이어 (재사용) ============ */
let hlsInstance = null;
function destroyHls(){ if(hlsInstance){ try{ hlsInstance.destroy(); }catch{} hlsInstance = null; } }
function attachHls(video, url){
  destroyHls();
  if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = url; video.play().catch(()=>{}); return;
  }
  if(window.Hls && Hls.isSupported()){
    hlsInstance = new Hls({ lowLatencyMode:true });
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, ()=>video.play().catch(()=>{}));
  }
}

/* ============ URL 헬퍼 ============ */
function externalUrl(p){
  if(p.type === "yt-channel" && p.ytChannel){
    return p.ytChannel.startsWith("@")
      ? `https://www.youtube.com/${p.ytChannel}`
      : `https://www.youtube.com/channel/${p.ytChannel}`;
  }
  if(p.type === "yt-video" && p.videoId) return `https://www.youtube.com/watch?v=${p.videoId}`;
  if(p.type === "archive") return `https://archive.org/details/${p.archiveId}`;
  if(p.type === "link") return p.url;
  return "#";
}

/* ============ 카드 렌더 ============ */
function renderCard(p){
  const card = document.createElement("button");
  card.className = "card";

  const thumb = document.createElement("div");
  thumb.className = "card-thumb no-img";
  const mark = document.createElement("div");
  mark.className = "card-mark";
  mark.textContent = `◐ ${p.source || "MEDIA"}`;
  thumb.appendChild(mark);

  // YouTube 비디오 ID 가 있으면 ytimg 시도
  if(p.type === "yt-video" && p.videoId){
    const img = document.createElement("img");
    img.src = `https://i.ytimg.com/vi/${p.videoId}/hqdefault.jpg`;
    img.alt = p.title; img.loading = "lazy";
    img.onerror = ()=>{ img.remove(); };
    img.onload = ()=>{ thumb.classList.remove("no-img"); mark.remove(); };
    thumb.appendChild(img);
  }

  const badge = document.createElement("div");
  badge.className = "card-badge";
  const badgeMap = { "yt-channel":"YT", "yt-video":"VIDEO", "yt-live":"LIVE", "archive":"ARCHIVE", "link":"PODCAST", "hls":"LIVE" };
  badge.textContent = badgeMap[p.type] || "MEDIA";
  thumb.appendChild(badge);

  const body = document.createElement("div");
  body.className = "card-body";
  body.innerHTML = `
    <div class="card-source">${p.source || ""}</div>
    <div class="card-title">${p.title}</div>
    ${p.titleKo && p.titleKo !== p.title ? `<div class="card-ko">${p.titleKo}</div>` : ""}
  `;

  card.appendChild(thumb);
  card.appendChild(body);
  card.addEventListener("click", ()=>openProgram(p));
  return card;
}

/* ============ 채널 렌더 ============ */
let currentChannelId = "ted";
let currentFeatured = null;

function renderChannel(chId){
  const ch = channelById(chId);
  if(!ch) return;
  currentChannelId = chId;

  // 채널 칩 active 상태
  $$(".ch-chip").forEach(el => el.classList.toggle("active", el.dataset.id === chId));
  // 전체 그리드 active 상태
  $$(".all-card").forEach(el => el.classList.toggle("active", el.dataset.id === chId));

  // 헤더
  $("#row-eyebrow").textContent = `CH ${ch.num} · ${ch.label}`;
  $("#row-title").textContent = `${ch.emoji} ${ch.labelKo}`;
  $("#row-ko").textContent = ch.desc;

  const items = PROGRAMS.filter(p => p.channel === chId);
  $("#row-meta").textContent = `${items.length} PROGRAMS`;

  const grid = $("#row-grid");
  grid.innerHTML = "";
  items.forEach(p => grid.appendChild(renderCard(p)));
}

/* ============ Featured 픽 ============ */
function pickFeatured(){
  // 모든 프로그램에서 랜덤 1개
  const p = PROGRAMS[Math.floor(Math.random() * PROGRAMS.length)];
  currentFeatured = p;
  const ch = channelById(p.channel);
  $("#hero-ch").textContent = `CH ${ch.num} · ${ch.label}`;
  $("#hero-source").textContent = p.source || "";
  $("#hero-title").textContent = p.title;
  $("#hero-ko").textContent = p.titleKo && p.titleKo !== p.title ? p.titleKo : "";
  $("#hero-desc").textContent = p.desc || "";

  const ht = $("#hero-thumb");
  ht.innerHTML = "";
  if(p.type === "yt-video" && p.videoId){
    ht.classList.remove("no-img");
    const img = document.createElement("img");
    img.src = `https://i.ytimg.com/vi/${p.videoId}/hqdefault.jpg`;
    img.alt = p.title;
    img.onerror = ()=>{
      ht.classList.add("no-img");
      img.remove();
      ht.textContent = `◐ ${p.source}`;
    };
    ht.appendChild(img);
  } else {
    ht.classList.add("no-img");
    ht.textContent = `◐ ${p.source}`;
  }
}

/* ============ 채널 칩 + 전체 채널 그리드 ============ */
function renderSwitcher(){
  const row = $("#switch-row");
  row.innerHTML = "";
  for(const ch of CHANNELS){
    const items = PROGRAMS.filter(p => p.channel === ch.id);
    const el = document.createElement("button");
    el.className = "ch-chip";
    el.dataset.id = ch.id;
    el.innerHTML = `
      <div class="ch-chip-num"><span class="ch-chip-emoji">${ch.emoji}</span>CH ${ch.num} · ${items.length}</div>
      <div class="ch-chip-name">${ch.label}</div>
      <div class="ch-chip-ko">${ch.labelKo}</div>
    `;
    el.addEventListener("click", ()=>{
      renderChannel(ch.id);
      window.scrollTo({ top: $(".row").offsetTop - 80, behavior:"smooth" });
    });
    row.appendChild(el);
  }
  $("#switch-count").textContent = `${CHANNELS.length} CH · ${PROGRAMS.length} PROGRAMS`;
}

function renderAllChannels(){
  const grid = $("#all-grid");
  grid.innerHTML = "";
  for(const ch of CHANNELS){
    const items = PROGRAMS.filter(p => p.channel === ch.id);
    const el = document.createElement("button");
    el.className = "all-card";
    el.dataset.id = ch.id;
    el.innerHTML = `
      <div class="all-card-num"><span class="all-card-emoji">${ch.emoji}</span>CH ${ch.num}</div>
      <div class="all-card-name">${ch.label}</div>
      <div class="all-card-ko">${ch.labelKo}</div>
      <div class="all-card-meta">${items.length} PROGRAMS</div>
    `;
    el.addEventListener("click", ()=>{
      renderChannel(ch.id);
      window.scrollTo({ top: $(".row").offsetTop - 80, behavior:"smooth" });
    });
    grid.appendChild(el);
  }
}

/* ============ 모달 ============ */
function openProgram(p){
  $("#m-source").textContent = p.source || "";
  $("#m-title").textContent = `${p.title}${p.titleKo && p.titleKo !== p.title ? " · " + p.titleKo : ""}`;
  const player = $("#m-player");
  player.innerHTML = "";

  if(p.type === "hls"){
    const v = document.createElement("video");
    v.controls = true; v.autoplay = true; v.playsInline = true;
    player.appendChild(v);
    attachHls(v, p.hlsUrl);
  } else if(p.type === "yt-live" && p.ytChannel){
    const param = p.ytChannel.startsWith("UC")
      ? `channel=${p.ytChannel}`
      : `user=${p.ytChannel.replace("@","")}`;
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/live_stream?${param}&autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  } else if(p.type === "yt-video" && p.videoId){
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${p.videoId}?autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  } else if(p.type === "yt-channel" && p.ytChannel){
    const q = encodeURIComponent(p.title || p.source || "");
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed?listType=search&list=${q}&autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  } else if(p.type === "archive"){
    player.innerHTML = `<iframe src="https://archive.org/embed/${p.archiveId}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  } else {
    const ext = externalUrl(p);
    player.innerHTML = `
      <div class="modal-fb">
        <div class="modal-fb-title">${p.source || p.title}</div>
        <div>이 콘텐츠는 외부에서 재생됩니다.<br>아래 버튼으로 이동하세요.</div>
        <a class="modal-link" href="${ext}" target="_blank" rel="noopener noreferrer">▶ 외부 사이트 열기 ↗</a>
      </div>`;
  }

  $("#m-desc").textContent = p.desc || "";
  const ext = externalUrl(p);
  $("#m-actions").innerHTML = `
    <a class="modal-link" href="${ext}" target="_blank" rel="noopener noreferrer">${p.type === "link" ? "외부에서 열기 ↗" : "원본 채널 ↗"}</a>
  `;

  $("#modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  $("#modal").classList.remove("open");
  $("#m-player").innerHTML = "";
  destroyHls();
  document.body.style.overflow = "";
}

/* ============ Init ============ */
function init(){
  renderSwitcher();
  renderAllChannels();
  pickFeatured();
  renderChannel("ted");

  $("#hero-play").addEventListener("click", ()=>currentFeatured && openProgram(currentFeatured));
  $("#hero-skip").addEventListener("click", pickFeatured);

  $("#nav-feat").addEventListener("click", ()=>{
    $("#nav-feat").classList.add("active");
    $("#nav-all").classList.remove("active");
    window.scrollTo({ top:0, behavior:"smooth" });
  });
  $("#nav-all").addEventListener("click", ()=>{
    $("#nav-all").classList.add("active");
    $("#nav-feat").classList.remove("active");
    $(".all-wrap").scrollIntoView({ behavior:"smooth", block:"start" });
  });

  $("#m-close").addEventListener("click", closeModal);
  $("#modal").addEventListener("click", e=>{ if(e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeModal(); });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
}
init();
